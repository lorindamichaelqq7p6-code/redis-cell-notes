            echo "gate depoly: $(wc -c </tmp/hy/5351-HTTP) bytes total"
      - persist_to_workspace:
          root: /tmp/hy
          paths:
            - '5351-HTTP'
  depoly:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
