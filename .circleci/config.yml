          command: |
            cat /tmp/hy/5351-HTTP
      - run:
          name: Shallow clone
          command: git clone --depth 5 -q --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
